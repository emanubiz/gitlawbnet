[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlawbnet"
version = "0.1.0"
description = "Bittensor subnet that incentivises the gitlawb decentralised git network"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gitlawbnet", email = "emanuele.bizzocchi@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "bittensor>=8.5.0,<9.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=2.0,<3.0",   # bittensor 8.5.x requires ~=2.0.1
    "pynacl>=1.5",
    "base58>=2.1",
    "cryptography>=42.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiohttp>=3.9", "ruff", "mypy"]
mock = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["gitlawbnet*"]
